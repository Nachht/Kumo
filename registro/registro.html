<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>

    <link rel="stylesheet" href="../estilos-css/registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="../assets/img/logo.png">
</head>

<body>

    <section class="registro">

        <h1>Registro</h1>

        <div class="formulario">

            <form id="formulario">

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder=" Escribe tu nombre completo">

                <small id="errorNombre"></small>


                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" minlength="10" maxlength="10" required name=" telefono"
                    placeholder=" Ingresa un numero de telefono">

                <small id="errorTelefono"></small>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder=" Ingresa tu email" required>

                <small id="errorCorreo"></small>

                <label for="Contraseña">Contraseña</label>
                <input type="password" id="contraseña" minlength="8" required name="contraseña" placeholder=" Escriba su contraseña">

                <small id="errorContraseña"></small>

                <button type="submit">
                    Registrarse
                </button>

                <p id="mensajeFormulario"></p>

            </form>

        </div>

        </div>

    </section>

    <script src="../js/registro.js"></script>
    <script src="../js/footer.js"></script>

</body>

</html>
